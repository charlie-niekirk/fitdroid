name: Set up Android build
description: JDK 17, Gradle, and CI Gradle properties

runs:
  using: composite
  steps:
    - name: Copy CI Gradle properties
      shell: bash
      run: |
        mkdir -p "$HOME/.gradle"
        cp "$GITHUB_WORKSPACE/.github/ci-gradle.properties" "$HOME/.gradle/gradle.properties"

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
