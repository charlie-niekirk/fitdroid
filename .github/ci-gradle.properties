# GitHub Actions Gradle settings. Copied to ~/.gradle/gradle.properties by setup-android.
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.configuration-cache=true
kotlin.incremental=false

# Retry flaky plugin/dependency downloads (plugin portal blips, 502/503).
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=500

